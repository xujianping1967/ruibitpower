    <title>Ruibit Power CMS</title>
    <!-- This page is not content. It is excluded from the sitemap and
         also carries the directive in its own head, so a crawler that
         ignores Netlify's X-Robots-Tag still stays out. -->

    <meta name="referrer" content="no-referrer" />

         3.x build into this page without a deploy on our side. The integrity
         hash is of that exact file, so a substituted or tampered bundle is
         refused by the browser rather than executed. When upgrading, change
         both the version and the hash together. -->
    <script
      src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"
      integrity="sha384-A/Gdn928CNLufmnGWGs9RM4Q9o8bSNLeJERqBFrBjwzL7FRpoLT3MPF8Tl0+Wd2p"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
